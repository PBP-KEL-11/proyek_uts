{% load static %}
<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="{% static '/css/style.css' %}">
        <title>Dashboard Admin</title>
    </head>

    <body class="admin-dashboard-body">
        <header class="site-header">
            <div class="container">

                <!-- Brand -->
                <a href="{% url 'main:show_main' %}" class="brand">
                    {{ name }}
                </a>

                <!-- Navigation -->
                <nav class="nav-menu">

                    {% if user.is_authenticated %}
                        <a href="{% url 'notes:index' %}">
                            Jurnal
                        </a>

                        <a href="{% url 'schedules:index' %}">
                            Schedule
                        </a>

                        <a href="{% url 'plants:index' %}">
                            Plants
                        </a>

                        <a href="{% url 'dashboard:index' %}">
                            Dashboard
                        </a>

                    

                        <a href="{% url 'authentication:profile' %}"
                        class="btn-login">
                            Profile
                        </a>

                        <a href="{% url 'authentication:logout_user' %}"
                        class="btn-register">
                            Logout
                        </a>

                    {% else %}

                        <a href="{% url 'authentication:login_user' %}"
                        class="btn-login">
                            Login
                        </a>

                        <a href="{% url 'authentication:register' %}"
                        class="btn-register">
                            Register
                        </a>

                    {% endif %}

                </nav>

            </div>
        </header>
        <main class="dashboard-main">

            <h1 class="admin-dashboard-title"> PENGGUNA TANAMIN</h1>
            
            <section class="search-section">
                <form method="get" class="search-form" id="search-form">
                    <input type="search"
                    id="search-input" 
                    value="{{ query }}"
                    class="search-form__input"
                    aria-label="Cari Pengguna"
                    placeholder="Cari Nama Pengguna">
                    <button type="submit" class="btn-primary">Search</button>
                </form>
            </section>

            <section class="card-grid-section">
                <div class="card-grid-container">
                    <div class="column-name">
                        <p>NAMA</p>
                        <p>LEVEL</p>
                        <p>GELAR</p>
                        <p>BADGE AKTIF</p>
                    </div>
                    <div id="grid">
                    </div>
                </div>
            </section>

        </main>
        <footer class="site-footer">

            <p>
                © 2026 Tanamin. Grow better, together.
            </p>

        </footer>
    </body>

    <script>
        const DATA = "{% url 'dashboard:get_greentrack_json' %}";
        let abortController;

        const gridContainer = document.getElementById("grid");
        const searchForm = document.getElementById("search-form");
        const searchInput = document.getElementById("search-input");

        const TIMER = 250;
        let searchDebouncer;

        function displayPage(){}

        function buildCard(data){
            const greentrack = data.fields;
            const greentrack_user = data.pk;

            const cardElement = document.createElement('div');

            const fullCardHtml = `
            <div class="card-container" onclick="location.href='/dashboard/admin-dashboard-details/${greentrack_user}';" style="cursor:pointer;">
            <p class="profile-name"> ${greentrack.username} </p>
            <p class="profile-level-number"> Lvl ${greentrack.level_number}</p>
            <p class="profile-level-name">${greentrack.current_level}</p>
            <p class="profile-badge">${greentrack.active_badge} </p>
            </div>`;

            cardElement.innerHTML = fullCardHtml;
            return cardElement;
        }

        async function getGreenTracks(query=""){
            if(abortController) abortController.abort();
            abortController = new AbortController();

            try{
                const url = query ?`${DATA}?user=${query}` : DATA;
                const response = await fetch(url, {
                    headers: {'Accept':'application/json'},
                    signal: abortController.signal,
                });

                const greentrack_data = await response.json();
                gridContainer.innerHTML = '';
                greentrack_data.forEach(data => {
                    gridContainer.appendChild(buildCard(data))
                });
            }
            catch(error){
                if(error.name === 'AbortError') return;
                console.error('Error loading projects', error);
            }
        }

        function searchUser(){
            getGreenTracks(searchInput.value.trim());
        }

        searchInput.addEventListener("input", function(){
            clearTimeout(searchDebouncer);
            searchDebouncer = setTimeout( function(){searchUser()}, DEBOUNCE_TIMER);
        })

        searchForm.addEventListener("submit", function(event){
            event.preventDefault();
            clearTimeout(searchDebouncer);
            searchUser();
        })

        getGreenTracks(searchInput.value.trim());
    </script>
</html>
