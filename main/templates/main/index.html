<!DOCTYPE html>
<html>
<head>
    <title>Tanamin</title>
</head>

<body>

    
{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<h1>Welcome to Tanamin!</h1>

{% if user.is_authenticated %}

    <p>
        Halo, {{ user.username }}!
    </p>

    <p>
        Kamu sudah login.
    </p>

    <a href="{% url 'authentication:profile' %}">
        Profile
    </a>

    <br><br>

    <a href="{% url 'authentication:logout_user' %}">
        Logout
    </a>

{% else %}

    <a href="{% url 'authentication:login_user' %}">
        Login
    </a>

    <br><br>

    <a href="{% url 'authentication:register' %}">
        Register
    </a>

{% endif %}

</body>
</html>
