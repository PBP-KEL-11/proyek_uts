<!DOCTYPE html>
<html>
<head>
    <title>Login - Tanamin</title>
</head>

<body>

<h1>Login</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Login
    </button>
</form>

<p>
    Don't have an account yet?
    <a href="{% url 'authentication:register' %}">
        Register
    </a>
</p>

</body>
</html>
