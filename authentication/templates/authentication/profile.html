{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Tanamin</title>

    <link rel="stylesheet" href="{% static 'authentication/css/style.css' %}">
</head>
<body class="n-body">

<div class="profile-layout-wrapper">

    <!-- sumber icon : lucide.dev -->

    <!-- Sidebar Kiri (Hijau Gelap) -->
    <aside class="profile-sidebar">
        <div class="sidebar-top">
            <div class="sidebar-user-info">
                <div class="user-avatar-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                        stroke-linejoin="round" class="lucide lucide-circle-user-round preview-icon">
                        <path d="M17.925 20.056a6 6 0 0 0-11.851.001"/>
                        <circle cx="12" cy="11" r="4"/><circle cx="12" cy="12" r="10"/>
                    </svg>
                </div>
                <div class="sidebar-user-text">
                    <div class="sidebar-username">{{ user.username }}</div>
                    <div class="sidebar-email">{{ user.email }}</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="{% url 'authentication:edit_profile' %}" title="Edit Profile">
                    <span class="nav-icon">
                            <!-- isi path hasil copy dari Lucide -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                                stroke-linejoin="round" class="lucide lucide-square-pen preview-icon">
                                <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>
                            </svg>
                    </span>
                    <span class="nav-label">Edit Profile</span>
                </a>
                <a href="{% url 'plants:index' %}" title="Tanaman Saya">
                    <span class="nav-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                            stroke-linejoin="round" class="lucide lucide-plant-pot preview-icon">
                            <path d="M14 8.536V6a4 4 0 014-4h1.5a.5.5 0 01.5.5V4a4 4 0 01-4 4 4 4 0 00-4 4 5 5 0 01-8-4 5 5 0 018 4c0 2 1 3 1 5"/>
                            <path d="m18 17-1.085 3.58A2 2 0 0115 22H9.002a2 2 0 01-1.913-1.418L6 17"/>
                            <path d="M5 17h14"/>
                        </svg>
                    </span>
                    <span class="nav-label">Tanaman Saya</span>
                </a>
                <a href="{% url 'schedules:index' %}" title="Lihat Jadwal">
                    <span class="nav-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                             stroke-linejoin="round" class="lucide lucide-calendar-days preview-icon">
                             <path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/>
                             <path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/>
                             <path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/>
                        </svg>
                    </span>
                    <span class="nav-label">Lihat Jadwal</span>
                </a>
            </nav>
        </div>

        <div>
            <a href="{% url 'main:show_main' %}" class="btn-kembali" title="Kembali">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                    stroke-linejoin="round" class="lucide lucide-arrow-left preview-icon">
                    <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
                </svg>
                <span class="nav-label">Kembali</span>
            </a>
        </div>
    </aside>

    <!-- Konten Utama di Kanan -->
    <main class="profile-main-content">
        <div class="profile-card">

            <h2 class="profile-title">Profile Account</h2>

            <div class="profile-card-body">

                <!-- Avatar -->
                <div class="profile-avatar-container">
                    <div class="avatar-circle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                            stroke-linejoin="round" class="lucide lucide-user-round preview-icon">
                                    
                            <circle cx="12" cy="8" r="5"/>
                            <path d="M20 21a8 8 0 0 0-16 0"/>
                        </svg>
                    </div>
                </div>

                <!-- Data profil -->
                <div class="profile-form-details">
                    <div class="form-group-profile">
                        <label>Username</label>
                        <div class="form-value-box">{{ user.username }}</div>
                    </div>

                    <div class="form-group-profile">
                        <label>Email Address</label>
                        <div class="form-value-box">{{ user.email|default:"-" }}</div>
                    </div>

                    <div class="form-group-profile">
                        <label>First Name</label>
                        <div class="form-value-box">{{ user.first_name|default:"-" }}</div>
                    </div>

                    <div class="form-group-profile mb-large">
                        <label>Last Name</label>
                        <div class="form-value-box">{{ user.last_name|default:"-" }}</div>
                    </div>

                </div>

            </div>
        </div>
    </main>
</div>

</body>
</html>
